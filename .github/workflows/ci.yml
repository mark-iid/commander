# Typecheck and the test suites, on every push and pull request.
#
# No deploy job: the Worker is deployed by Cloudflare Workers Builds, which
# watches this repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    name: tsc and vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm 11 blocks package install scripts unless they are listed in
      # allowScripts in package.json. workerd and esbuild are listed there, so
      # `npm ci` runs theirs and the Worker runtime actually installs. Without
      # that the vitest step fails on a missing binary.
      - run: npm ci

      # The Worker tests run inside workerd against a real D1 built from
      # migrations/, so this needs no Cloudflare account and no network beyond
      # the install.
      - run: npx tsc -b

      - run: npx vitest run
