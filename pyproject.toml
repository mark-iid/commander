[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commander-tracker"
version = "0.1.0"
description = "Real-time stat tracker and prize leaderboard for MTG Commander tournament nights"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "itsdangerous>=2.1",        # signed session cookies for passcode auth
]

[project.optional-dependencies]
# ruff is pinned to a minor range on purpose. Pinning the `select` set below fixes which rule
# *categories* run, not which rules live inside them — ruff adds rules to UP, B and friends in
# ordinary minor releases, which would turn CI red on a morning nobody touched the code.
# Bumping is a deliberate commit that carries its own fixes.
dev = ["pytest>=8.0", "ruff>=0.16.1,<0.17", "httpx"]

[tool.setuptools]
# Templates and static assets are part of the package, not just the repo.
packages = ["app", "app.routes"]

[tool.setuptools.package-data]
app = ["schema.sql", "templates/**/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The rule set lives here, not in the CI workflow, so `ruff check .` gives a developer the same
# answer it gives CI. A set that exists only in a yaml drifts from what anyone runs by hand.
#   E4/E7/E9  import, statement and syntax errors    F  pyflakes (undefined names, unused imports)
#   B         bugbear (likely bugs)                  UP pyupgrade (modern syntax for py312+)
#   I         import sorting
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
