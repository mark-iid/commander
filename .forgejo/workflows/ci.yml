# CI/CD for Commander Tracker, on the maintainer's own Forgejo instance.
#
# If you have forked this, you want .github/workflows/ci.yml instead. This file
# is kept because the FastAPI app in app/ is still what serves the event while
# the Worker port finishes (see docs/adr/0003), and this is what deploys it. It
# runs on a self-hosted runner with a label nobody else has.
#
# Why .forgejo/ and not .github/: this repo is hosted on Forgejo, not GitHub. Forgejo Actions
# reads workflows from both paths, so either would run — .github/ would just imply a home this
# project does not have.
#
# Runs on a host-mode Forgejo runner installed INSIDE the deployment container,
# label `commander-lxc`. Host mode rather than Docker because that container has no container
# runtime, so jobs execute directly on it.
#
# Consequence worth knowing: there is no Python matrix any more. Host mode offers only the
# container's interpreter, so tests run on the version actually deployed (3.13) and nothing
# else. The previous 3.12/3.13/3.14 matrix needed `actions/setup-python` to fetch interpreters,
# which is not dependable without a container runtime. Installing Docker in that container (nesting is
# already enabled) would let the matrix come back.
#
# HOW ACTIONS RESOLVE ON FORGEJO — worth knowing before debugging a failure here.
# `uses: actions/checkout@v4` is NOT fetched from github.com. Forgejo fetches it from the
# instance's configured action host (DEFAULT_ACTIONS_URL, default https://data.forgejo.org).
# If an action fails to resolve, fully qualify it: uses: https://github.com/actions/checkout@v4
#
# The deploy job ships to production automatically on push to main. That is a deliberate
# choice by the project owner, replacing the earlier manual gate. Guard rail: a `HOLD` file at
# the repo root stops deploys without needing a revert — useful for freezing releases during
# an event.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: commander-lxc
    # Bounds a label mismatch: a job whose label matches no runner waits forever rather than
    # failing, which is the worst possible symptom because there is no error to read.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install into a throwaway venv
        # A venv per run, inside the workspace — never the live venv at
        # /opt/commander-tracker/.venv, which is serving traffic while this runs.
        run: |
          python3 -m venv .ci-venv
          ./.ci-venv/bin/pip install -q --upgrade pip
          ./.ci-venv/bin/pip install -q -e ".[dev]"

      - name: Lint
        # Bare `ruff check` on purpose: the rule set is pinned in pyproject.toml, so this gives
        # CI exactly the same answer a developer gets locally. Runs before the tests so a style
        # failure is not buried under a test log.
        run: ./.ci-venv/bin/ruff check .

      - name: Test
        # The suite needs no environment at all — the fixtures monkeypatch TRACKER_PASSCODE and
        # SESSION_SECRET themselves. If a future test needs a real secret, that is a design
        # problem in the test, not a reason to add one here.
        run: ./.ci-venv/bin/pytest -q

  deploy:
    needs: test                       # never ships a red build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: commander-lxc
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        # Everything in one step, teed to a log the runner owns. Forgejo streams job
        # output to the web UI and nowhere else, which makes a failing deploy invisible
        # from a shell. This file is the diagnosis of record.
        run: |
          set -o pipefail
          deploy() {
            set -e
            set -x

            if [ -f HOLD ]; then
              echo "HOLD file present — deploy stopped on purpose."
              cat HOLD
              return 1
            fi

            # Backup first, so there is always a way back. Keep ten of these.
            # Prefixed so the rotation only ever counts and deletes its own: the
            # app's reset writes commander.db.* into the same directory, and the
            # backup taken before a reset must not age out after ten pushes.
            mkdir -p /var/lib/commander-tracker/backups
            cp /var/lib/commander-tracker/commander.db \
               "/var/lib/commander-tracker/backups/deploy.commander.db.$(date +%Y%m%d-%H%M%S)" || true
            # `|| true`: under pipefail a grep that matches nothing (the cp above
            # failed) would stop the deploy over a rotation with nothing to do.
            ls -1t /var/lib/commander-tracker/backups | { grep '^deploy\.' || true; } | tail -n +11 | \
              xargs -r -I{} rm -f "/var/lib/commander-tracker/backups/{}"

            # The excludes are the operational contract: config/event.yaml holds the real
            # roster and auth policy, .env holds the passcode, and the database and live
            # venv must survive. None can be rebuilt from this repo.
            # The runner OWNS this tree; do NOT chown it back to tracker afterwards —
            # that handed ownership away and broke every following deploy.
            rsync -a --delete --no-o --no-g \
              --exclude '.git' --exclude '.ci-venv' --exclude '.venv' \
              --exclude 'config/event.yaml' --exclude '.env' \
              --exclude '*.egg-info' \
              --exclude '__pycache__' --exclude '.pytest_cache' --exclude '.ruff_cache' \
              ./ /opt/commander-tracker/

            /opt/commander-tracker/.venv/bin/pip install -q -e "/opt/commander-tracker[dev]"

            sudo /usr/bin/systemctl restart commander-tracker
            sleep 4
            sudo /usr/bin/systemctl is-active commander-tracker

            # A green restart is not proof the app works.
            code() { wget -q -S -O /dev/null "http://127.0.0.1:8000$1" 2>&1 | awk '/HTTP\//{print $2; exit}'; }
            for path in /login /display; do
              c=$(code "$path"); echo "smoke $path -> $c"
              [ "$c" = "200" ] || return 1
            done
            c=$(code /entry); echo "smoke /entry -> $c"
            case "$c" in 302|303) ;; *) return 1 ;; esac
          }
          deploy 2>&1 | tee /var/lib/forgejo-runner/deploy.log
